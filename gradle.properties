org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
# Derleme önbelleği: aynı girdiyle yeniden çalışan görevler (derleme, test) önbellekten gelir
org.gradle.caching=true
# Yapılandırma önbelleği: :core:test :app:test :cli:compileKotlin ve :app:createDistributable ile denendi, çalışıyor.
# Uyumsuz bir görev (ör. syncPluginTemplate, paketleme görevleri) hatayla durdurmak yerine uyarı verir.
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
kotlin.code.style=official

# Uygulama sürümü tek yerden okunur: app/build.gradle.kts ve scripts/release.ps1 buraya bakar
seyirVersion=1.0.0
