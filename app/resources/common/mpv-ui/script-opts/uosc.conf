# Seyir oynatıcı görünümü (uosc ayarları). Burada yazmayan seçenekler uosc'nin varsayılanıdır.
# Renkler Seyir'in teması ile aynıdır (app/src/main/kotlin/seyir/app/ui/Theme.kt: SeyirColors).
# Arayüz dili Seyir'den --script-opts=uosc-languages=tr|en ile verilir.

# --- Renkler (RRGGBB) ---
# foreground: ilerleme, simgeler, seçili öğe  = vurgu (accent, kehribar)
# foreground_text: vurgu üstündeki yazı       = onAccent
# background: çubuk ve menü zemini            = surface
# background_text: zemin üstündeki yazı       = text
color=foreground=e0a33a,foreground_text=1a1305,background=0f0f12,background_text=f4f4f6,window_border=34343c,curtain=0f0f12,success=4cc38a,error=ff7a70,match=e0a33a,heatmap=e0a33a

# --- İlerleme çubuğu ---
timeline_style=line
timeline_line_width=3
timeline_size=40
timeline_persistency=paused
timeline_border=0
timeline_step=10
timeline_cache=yes
timeline_heatmap=no
progress=windowed
progress_size=3
progress_line_width=20
buffered_time_threshold=60

# --- Denetim çubuğu ---
# Sol: oynat/duraklat, sonraki bölüm (seyir.lua yalnız sonraki bölüm varken gösterir)
# Sağ: altyazı (altyazı varsa), ses (birden çok ses varsa), kalite (seyir.lua: birden çok katman varsa), menü, tam ekran
controls=button:seyir_prev,play-pause,button:seyir_next,space,<has_sub>subtitles,<has_many_audio>audio,button:seyir_quality,button:seyir_menu,gap:0.3,fullscreen
controls_size=36
controls_margin=8
controls_spacing=4
controls_persistency=paused

volume=right
volume_size=40
volume_border=0
volume_step=5

# --- Menüler ---
menu_item_height=38
menu_min_width=300
menu_padding=6
menu_type_to_search=no

# --- Üst çubuk: yalnız tam ekranda ve çerçevesiz pencerede başlığı gösterir ---
top_bar=no-border
top_bar_size=44
top_bar_controls=right
top_bar_title=yes
top_bar_flash_on=video,audio
window_border_size=1

# --- Genel ---
scale=1
scale_fullscreen=1.25
font_scale=1
text_border=1.2
border_radius=8
animation_duration=140
pause_indicator=flash
time_precision=0
refine=text_width
autoload=no
shuffle=no
