# thumbfast: ileri sarma çubuğunda önizleme görüntüsü.
# Seyir adresleri yerel aktarıcıdan (http://127.0.0.1) geçtiği için mpv bunları ağ akışı sayar;
# varsayılan olarak ağ akışlarında önizleme kapalıdır, burada açılır.
network=yes

# Önizleme en çok bu boyuta sığacak şekilde üretilir
max_height=200
max_width=360

# Önizleme sürecini bir süre kullanılmazsa kapat (saniye); ağ kullanımı ve bellek için
quit_after_inactivity=60

# Yazılım çözümleme (önizleme küçük ve seyrek; ekran kartı gerektirmez)
hwdec=no
