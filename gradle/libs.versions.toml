[versions]
kotlin = "2.4.0"
# CloudStream kütüphanesi (JitPack, sabit commit)
cloudstream = "5024ace292"
nicehttp = "0.4.18"
jsoup = "1.22.1"
jackson = "2.13.1"
coroutines = "1.11.0"
jspecify = "1.0.0"
bouncycastle = "1.86"
newpipe = "v0.26.3"
compose = "1.12.2"
coil = "3.3.0"
jna = "5.15.0"
dex2jar = "2.4.28"

[libraries]
cloudstream-library = { module = "com.github.recloudstream.cloudstream:library-jvm", version.ref = "cloudstream" }
nicehttp = { module = "com.github.Blatzar:NiceHttp", version.ref = "nicehttp" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
jackson-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin", version.ref = "jackson" }
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
bouncycastle = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
newpipe = { module = "com.github.teamnewpipe:NewPipeExtractor", version.ref = "newpipe" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
dex2jar-translator = { module = "de.femtopedia.dex2jar:dex-translator", version.ref = "dex2jar" }
coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose = { id = "org.jetbrains.compose", version.ref = "compose" }
